spring.application.name=church-pos
# 1. Configuración de la Base de Datos
spring.datasource.url=jdbc:mysql://${DB_HOST:josue-VB.local}:3306/church_pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guatemala
spring.datasource.username=root
spring.datasource.password=admin

# 2. Configuración de JPA (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Configuración del Servidor
server.port=8080
server.address=0.0.0.0